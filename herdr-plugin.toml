id = "herdr-crossroads"
name = "Herdr Crossroads"
description = "Navigate your Herdr. Find your sheep when you need them."
version = "0.1.0"
min_herdr_version = "0.9.1"
platforms = ["linux"]

[[build]]
command = ["python3", "scripts/install-binary.py"]

[[actions]]
id = "setup-keybind"
title = "Set up prefix+f launch binding"
contexts = ["global"]
command = ["python3", "scripts/setup-keybind.py"]

[[panes]]
id = "crossroads"
title = "Herdr Crossroads"
placement = "popup"
command = ["./target/release/herdr-crossroads"]
